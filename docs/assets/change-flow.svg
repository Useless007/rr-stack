<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="268" viewBox="0 0 1000 268" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How a change travels through RR stack, and where bun run check verifies it</title>
  <rect width="1000" height="268" rx="14" fill="#eef2f6"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17695f"/></marker>
  </defs>
  <g font-size="13" fill="#0e1a2b">
    <g transform="translate(28 34)">
      <rect width="160" height="104" rx="10" fill="#fff" stroke="#0e1a2b" stroke-opacity=".18"/>
      <text x="16" y="30" font-size="16" font-weight="600">Postgres</text>
      <text x="16" y="52" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#17695f">migrations/*.sql</text>
      <text x="16" y="80" fill="#0e1a2b" fill-opacity=".7">the schema</text>
    </g>
    <g transform="translate(224 34)">
      <rect width="160" height="104" rx="10" fill="#fff" stroke="#0e1a2b" stroke-opacity=".18"/>
      <text x="16" y="30" font-size="16" font-weight="600">Rust API</text>
      <text x="16" y="52" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#17695f">server/src/*.rs</text>
      <text x="16" y="80" fill-opacity=".7">SQLx checks every</text>
      <text x="16" y="96" fill-opacity=".7">query vs the schema</text>
    </g>
    <g transform="translate(420 34)">
      <rect width="160" height="104" rx="10" fill="#fff" stroke="#0e1a2b" stroke-opacity=".18"/>
      <text x="16" y="30" font-size="16" font-weight="600">Contract</text>
      <text x="16" y="52" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#17695f">openapi.json</text>
      <text x="16" y="80" fill-opacity=".7">derived from the</text>
      <text x="16" y="96" fill-opacity=".7">handlers (utoipa)</text>
    </g>
    <g transform="translate(616 34)">
      <rect width="160" height="104" rx="10" fill="#fff" stroke="#0e1a2b" stroke-opacity=".18"/>
      <text x="16" y="30" font-size="16" font-weight="600">Client</text>
      <text x="16" y="52" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#17695f">web/app/api/</text>
      <text x="16" y="80" fill-opacity=".7">hooks and typed</text>
      <text x="16" y="96" fill-opacity=".7">errors (hey-api)</text>
    </g>
    <g transform="translate(812 34)">
      <rect width="160" height="104" rx="10" fill="#fff" stroke="#0e1a2b" stroke-opacity=".18"/>
      <text x="16" y="30" font-size="16" font-weight="600">React</text>
      <text x="16" y="52" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#17695f">web/app/routes/</text>
      <text x="16" y="80" fill-opacity=".7">tsc checks every</text>
      <text x="16" y="96" fill-opacity=".7">call and field</text>
    </g>
  </g>
  <g stroke="#17695f" stroke-width="2" marker-end="url(#a)">
    <line x1="190" y1="86" x2="220" y2="86"/>
    <line x1="386" y1="86" x2="416" y2="86"/>
    <line x1="582" y1="86" x2="612" y2="86"/>
    <line x1="778" y1="86" x2="808" y2="86"/>
  </g>
  <g stroke="#3fb6a8" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="205" y1="92" x2="205" y2="176"/>
    <line x1="401" y1="92" x2="401" y2="176"/>
    <line x1="597" y1="92" x2="597" y2="176"/>
    <line x1="793" y1="92" x2="793" y2="176"/>
  </g>
  <rect x="28" y="176" width="944" height="64" rx="10" fill="#0e1a2b"/>
  <text x="52" y="204" font-size="15" font-weight="600" fill="#eef2f6">bun run check</text>
  <text x="52" y="226" font-size="13" fill="#eef2f6" fill-opacity=".8">regenerates the contract and client, then compiles, lints, typechecks, builds and tests. Exit 0 means every arrow above holds.</text>
</svg>
