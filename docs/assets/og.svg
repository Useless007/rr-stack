<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0e1a2b"/>
  <!-- floor shadow -->
  <ellipse cx="905" cy="560" rx="210" ry="22" fill="#000" opacity="0.25"/>

  <!-- React atom, held up by the right claw -->
  <g transform="translate(985 200)" fill="none" stroke="#61dafb" stroke-width="11">
    <ellipse rx="118" ry="44"/>
    <ellipse rx="118" ry="44" transform="rotate(60)"/>
    <ellipse rx="118" ry="44" transform="rotate(120)"/>
    <circle r="19" fill="#61dafb" stroke="none"/>
  </g>

  <g stroke-linecap="round" fill="none" stroke="#c2421b" stroke-width="16">
    <!-- legs -->
    <path d="M760 470 q-55 10 -78 62"/>
    <path d="M775 492 q-40 22 -50 66"/>
    <path d="M800 506 q-22 28 -18 62"/>
    <path d="M1050 470 q55 10 78 62"/>
    <path d="M1035 492 q40 22 50 66"/>
    <path d="M1010 506 q22 28 18 62"/>
    <!-- arms -->
    <path d="M770 420 q-70 -20 -82 -105" stroke="#e0531f" stroke-width="20"/>
    <path d="M1035 425 q45 -30 30 -90" stroke="#e0531f" stroke-width="20"/>
  </g>

  <!-- body: a scalloped shell -->
  <path d="M735 470
           C 720 410, 745 372, 790 360
           q 14 -26 38 -16  q 18 -30 46 -14  q 26 -26 52 -2  q 30 -20 50 10  q 30 -8 40 22
           C 1065 372, 1090 410, 1075 470
           C 1060 515, 990 530, 905 530
           C 820 530, 750 515, 735 470 Z" fill="#f5662f"/>
  <!-- belly shade -->
  <path d="M760 488 C 800 518, 1010 518, 1050 488 C 1030 515, 980 528, 905 528 C 830 528, 780 515, 760 488 Z" fill="#c2421b" opacity="0.55"/>

  <!-- face -->
  <ellipse cx="862" cy="430" rx="17" ry="22" fill="#14100e"/>
  <ellipse cx="948" cy="430" rx="17" ry="22" fill="#14100e"/>
  <circle cx="868" cy="422" r="6.5" fill="#fff"/>
  <circle cx="954" cy="422" r="6.5" fill="#fff"/>
  <ellipse cx="830" cy="462" rx="17" ry="9" fill="#ff9aa2" opacity="0.7"/>
  <ellipse cx="980" cy="462" rx="17" ry="9" fill="#ff9aa2" opacity="0.7"/>
  <path d="M885 462 q20 18 40 0" fill="none" stroke="#14100e" stroke-width="6" stroke-linecap="round"/>

  <!-- left claw, waving -->
  <g transform="translate(686 300) rotate(-20)">
    <path d="M0 26 C -38 26, -46 -20, -18 -44 C -6 -54, 12 -52, 18 -40 L 2 -14 L 30 -22 C 36 -4, 26 26, 0 26 Z" fill="#f5662f"/>
  </g>

  <!-- right claw: the jaws close on both sides of one orbit's tip -->
  <g transform="translate(1041.5 297.7) rotate(60)">
    <circle cx="42" cy="0" r="30" fill="#f5662f"/>
    <path d="M 38 -8 C 36 -54, -8 -66, -36 -40 C -46 -30, -46 -24, -40 -21 L -4 -21 Z" fill="#f5662f"/>
    <path d="M 38 8 C 32 48, -4 54, -30 34 C -37 28, -38 24, -35 21 L -4 21 Z" fill="#f5662f"/>
    <path d="M 22 -36 q -22 -14 -44 -4" fill="none" stroke="#ff9466" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- wordmark and tagline -->
  <g font-family="IBM Plex Sans Variable" fill="#eef2f6">
    <text x="80" y="250" font-size="104" font-weight="600" letter-spacing="-3">RR<tspan fill="#3fb6a8">/</tspan>stack</text>
    <text x="84" y="318" font-size="34" fill="#a9b7c8">React Router and Rust,</text>
    <text x="84" y="362" font-size="34" fill="#a9b7c8">typed from the database to the screen.</text>
  </g>
  <g font-family="IBM Plex Mono" font-size="26">
    <rect x="80" y="420" width="430" height="60" rx="10" fill="#1b2a40"/>
    <text x="104" y="459" fill="#3fb6a8">$ <tspan fill="#eef2f6">bun create rr-stack</tspan></text>
  </g>
</svg>
