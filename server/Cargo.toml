[package]
name = "rr-server"
version = "0.1.0"
edition = "2024"

# The lib and binary are always called `server`, so renaming the package (create-rr-stack does) never touches code.
[lib]
name = "server"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Argon2 is unusably slow unoptimised; this keeps sign-in fast in `bun run dev` and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
