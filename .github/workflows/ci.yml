name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rr
          POSTGRES_PASSWORD: rr
          POSTGRES_DB: rr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rr" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://rr:rr@localhost:5432/rr
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-all-crates: true
      - run: cargo install sqlx-cli --locked --no-default-features --features postgres,rustls
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: build with no database (offline .sqlx/)
        run: env -u DATABASE_URL SQLX_OFFLINE=true cargo build --all-targets
        working-directory: server
      - run: scripts/check.sh
      - run: scripts/smoke.sh
