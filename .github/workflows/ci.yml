name: ci
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-all-crates: true

      - name: Postgres (Linux, the project's own compose file)
        if: runner.os == 'Linux'
        run: cp .env.example .env && docker compose up -d --wait db
      - name: Postgres (Windows, preinstalled on the runner)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          $svc = Get-Service -Name "postgresql*"
          Set-Service -InputObject $svc -Status running -StartupType automatic
          & "$env:PGBIN\pg_isready" -t 30
          & "$env:PGBIN\psql" -U postgres -c "CREATE ROLE app LOGIN SUPERUSER PASSWORD 'app';"
          & "$env:PGBIN\psql" -U postgres -c "CREATE DATABASE app OWNER app;"
          "DATABASE_URL=postgres://app:app@localhost:5432/app" >> $env:GITHUB_ENV

      - run: cargo install sqlx-cli --locked --no-default-features --features postgres,rustls
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: build with no database (offline .sqlx/)
        shell: bash
        run: env -u DATABASE_URL SQLX_OFFLINE=true cargo build --all-targets
        working-directory: server

      # Only in the rr-stack template repo, which also holds the create-rr-stack CLI.
      - if: hashFiles('cli/package.json') != ''
        run: bun install --frozen-lockfile
        working-directory: cli

      - run: bun run check
      - run: bun run smoke

      - name: scaffold a project with the CLI and check it
        if: hashFiles('cli/package.json') != ''
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          bun "$GITHUB_WORKSPACE/cli/index.ts" ci-demo --spa --tailwind --yes --no-git
          cd ci-demo
          SKIP_DB=1 bun run check

      - name: scaffold a --ssr project, check it and smoke-test the rendered pages
        if: hashFiles('cli/package.json') != ''
        shell: bash
        run: |
          # This repo's database (Linux: from .env, Windows: from the step above), not the new app's.
          [ -n "${DATABASE_URL:-}" ] || export "$(grep '^DATABASE_URL=' "$GITHUB_WORKSPACE/.env")"
          cd "$RUNNER_TEMP"
          bun "$GITHUB_WORKSPACE/cli/index.ts" ci-ssr --ssr --tailwind --yes --no-git
          cd ci-ssr
          bun run check
          bun run smoke

      - name: scaffold --astryx projects (SPA and SSR), check them and smoke-test them
        if: hashFiles('cli/package.json') != ''
        shell: bash
        run: |
          [ -n "${DATABASE_URL:-}" ] || export "$(grep '^DATABASE_URL=' "$GITHUB_WORKSPACE/.env")"
          cd "$RUNNER_TEMP"
          for mode in spa ssr; do
            bun "$GITHUB_WORKSPACE/cli/index.ts" ci-astryx-$mode --$mode --astryx --yes --no-git
            (cd ci-astryx-$mode && bun run check && bun run smoke)
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose up -d serves the whole app
        run: |
          docker compose up -d --build --wait
          url="http://$(docker compose port app 3000)"
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 "$url/api/health"
          curl -fsS "$url/" | grep -q "typed from the database to the screen"
          # The session cookie is Secure; pass it by hand instead of relying on curl's cookie jar over http.
          session=$(curl -fsS -D - -o /dev/null -X POST -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' "$url/api/auth/register" \
            | grep -i '^set-cookie:' | sed -E 's/^[^:]+: *([^;]+).*/\1/' | tr -d '\r')
          test -n "$session"
          curl -fsS -H "cookie: $session" -X POST -H 'content-type: application/json' -d '{"title":"from docker"}' "$url/api/todos"

  docker-ssr:
    strategy:
      fail-fast: false
      matrix:
        ui: [tailwind, astryx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only in the rr-stack template repo; a project made from it skips this job's steps.
      - if: hashFiles('cli/package.json') != ''
        uses: oven-sh/setup-bun@v2
      - if: hashFiles('cli/package.json') != ''
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: a --ssr project's docker compose up -d renders pages with their data
        if: hashFiles('cli/package.json') != ''
        run: |
          cd "$RUNNER_TEMP"
          bun "$GITHUB_WORKSPACE/cli/index.ts" ssr-docker --ssr --${{ matrix.ui }} --yes --no-git --no-install
          cd ssr-docker
          docker compose up -d --build --wait
          url="http://$(docker compose port app 3000)"
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 "$url/api/health"
          curl -fsS "$url/" | grep -q "typed from the database to the screen"
          session=$(curl -fsS -D - -o /dev/null -X POST -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' "$url/api/auth/register" \
            | grep -i '^set-cookie:' | sed -E 's/^[^:]+: *([^;]+).*/\1/' | tr -d '\r')
          id=$(curl -fsS -H "cookie: $session" -H 'content-type: application/json' -d '{"title":"from docker ssr"}' "$url/api/todos" \
            | sed -E 's/.*"id":([0-9]+).*/\1/')
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 -H "cookie: $session" "$url/app/todos/$id" \
            | grep -q "<title>from docker ssr"
