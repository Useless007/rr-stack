name: ci
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: postgres://rr:rr@localhost:5432/rr
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cache-all-crates: true

      - name: Postgres (Linux, Docker)
        if: runner.os == 'Linux'
        run: docker compose up -d --wait
      - name: Postgres (Windows, preinstalled on the runner)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          $svc = Get-Service -Name "postgresql*"
          Set-Service -InputObject $svc -Status running -StartupType automatic
          & "$env:PGBIN\psql" -U postgres -c "CREATE ROLE rr LOGIN SUPERUSER PASSWORD 'rr';"
          & "$env:PGBIN\psql" -U postgres -c "CREATE DATABASE rr OWNER rr;"

      - run: cargo install sqlx-cli --locked --no-default-features --features postgres,rustls
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: cli
      - name: build with no database (offline .sqlx/)
        shell: bash
        run: env -u DATABASE_URL SQLX_OFFLINE=true cargo build --all-targets
        working-directory: server
      - run: bun run check
      - run: bun run smoke
      - name: scaffold a project with the CLI and build it
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          bun "$GITHUB_WORKSPACE/cli/index.ts" ci-demo --yes --no-git
          cd ci-demo
          SKIP_DB=1 bun run check
