name: Feature request
description: Something RR stack should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The app or situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I would like to open the pull request myself
