name: Bug report
description: Something in RR stack or create-rr-stack does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS, `bun --version`, `rustc --version`, and the create-rr-stack version that made the project.
      placeholder: Windows 11, bun 1.2.23, rustc 1.99.1, create-rr-stack 0.2.0
    validations:
      required: true
